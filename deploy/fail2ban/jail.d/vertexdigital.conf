# Bans an address that keeps failing sign-ins on the store or the panel (ADR 0008). Deliberately
# looser than the API's own limits (10 a minute per address, ALTCHA after 10 failures per admin
# account): it stops sustained guessing, not a customer who mistyped. Installed as
# /etc/fail2ban/jail.d/vertexdigital.conf by deploy/provision.sh.
[vertexdigital-auth]
enabled = true
port = http,https
filter = vertexdigital-auth
logpath = /var/log/nginx/digital.vertexmedia.pro.access.log
          /var/log/nginx/digital-admin.vertexmedia.pro.access.log
maxretry = 20
findtime = 10m
bantime = 1h

# Bans an address that keeps hitting the rate limits of both hosts (audit A10-10). The sites log
# their refusals below the level the server-wide nginx-limit-req jail reads: one carrier address
# is shared by many Syrian customers, and that jail banned it from every site after ten. This one
# waits for a sustained flood: 300 refusals in 10 minutes.
[vertexdigital-limit]
enabled = true
port = http,https
filter = vertexdigital-limit
logpath = /var/log/nginx/digital.vertexmedia.pro.access.log
          /var/log/nginx/digital-admin.vertexmedia.pro.access.log
maxretry = 300
findtime = 10m
bantime = 1h
