# Requests the Vertex Digital hosts refused for their rate (429, from nginx's zones or the API's
# own limits), counted in the access logs (audit A10-10). Installed as
# /etc/fail2ban/filter.d/vertexdigital-limit.conf by deploy/provision.sh.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ [^"]*" 429 
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
