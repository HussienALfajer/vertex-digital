# Failed sign-ins on both Vertex Digital hosts (ADR 0008), from the nginx access logs: Better Auth
# answers 401 to a wrong email or password, a wrong TOTP code or backup code. Case-insensitive,
# with any query string or trailing slash, as nginx and the API accept those too. Installed as
# /etc/fail2ban/filter.d/vertexdigital-auth.conf by deploy/provision.sh.
[Definition]
failregex = (?i)^<HOST> - \S+ \[[^\]]+\] "POST /api/(?:admin/)?auth/(?:sign-in/email|two-factor/verify-(?:totp|backup-code))/?(?:\?\S*)? HTTP/[\d.]+" 401 
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
