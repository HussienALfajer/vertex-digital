# Compression for the Vertex Digital hosts, installed as
# /etc/nginx/snippets/vertexdigital-compression.conf when the server's nginx has no Brotli module
# (deploy/provision.sh chooses). The apps do not compress: nginx does. `text/x-component` is the
# App Router's payload of every client navigation and prefetch (audit A10-9).
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json
    text/javascript text/x-component application/xml;
