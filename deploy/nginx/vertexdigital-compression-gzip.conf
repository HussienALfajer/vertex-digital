# Compression for the Vertex Digital hosts, installed as
# /etc/nginx/snippets/vertexdigital-compression.conf when the server's nginx has no Brotli module
# (deploy/provision.sh chooses). The apps do not compress: nginx does.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;
