# Compression for the Vertex Digital hosts, installed as
# /etc/nginx/snippets/vertexdigital-compression.conf when the server's nginx has the Brotli module
# (deploy/provision.sh chooses). Brotli for browsers that accept it (smaller on slow connections,
# ADR 0008), gzip for the rest. The apps do not compress: nginx does.
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;
