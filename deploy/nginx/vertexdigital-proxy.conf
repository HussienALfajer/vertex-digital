# Proxy settings for the Vertex Digital API and store, installed as
# /etc/nginx/snippets/vertexdigital-proxy.conf.
# X-Forwarded-For is overwritten, never appended: the API's rate limits and Better Auth's sign-in
# limits key on its first value, and only nginx can reach the apps (they listen on loopback).
# No proxy_read_timeout here: nginx's default (60 s) applies, and the notification stream sets its
# own in its location (a directive set twice in one location fails `nginx -t`).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
proxy_hide_header X-Powered-By;
