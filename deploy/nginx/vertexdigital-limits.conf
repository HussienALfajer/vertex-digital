# Rate-limit zones for the Vertex Digital hosts, installed as
# /etc/nginx/conf.d/vertexdigital-limits.conf. Defence in depth under the API's and Better Auth's
# own limits (ADR 0008). Hits are logged to the sites' error logs, which the server's
# nginx-limit-req fail2ban jail watches.
# Sign-in and the ALTCHA challenge: 30 a minute per address. Syrian mobile carriers put many
# customers behind one address, so this stays well above one person's use.
limit_req_zone $binary_remote_addr zone=vdsignin:10m rate=30r/m;
# Deposit creation and receipt uploads (S03, ADR 0008): 10 a minute per address, under the API's
# per-customer counters in PostgreSQL.
limit_req_zone $binary_remote_addr zone=vddeposit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vdupload:10m rate=10r/m;
# Purchases (S08 rule O1): POST only (an empty key is not counted), 6 a minute per address with a
# burst, under the API's counters (10 per 10 minutes per customer, 30 per address).
map $request_method $vd_purchase_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $vd_purchase_key zone=vdpurchase:10m rate=6r/m;
# Code reveals (S08 rule C2): 30 a minute per address, under the API's 30 per 10 minutes per
# customer.
limit_req_zone $binary_remote_addr zone=vdreveal:10m rate=30r/m;
# Supplier webhooks (S08 rule F4): 120 a minute per address, as the API.
limit_req_zone $binary_remote_addr zone=vdwebhook:10m rate=120r/m;
