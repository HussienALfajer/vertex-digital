# Rate-limit zones for the Vertex Digital hosts, installed as
# /etc/nginx/conf.d/vertexdigital-limits.conf. Defence in depth under the API's and Better Auth's
# own limits (ADR 0008). Hits are logged to the sites' error logs, which the server's
# nginx-limit-req fail2ban jail watches.
# Sign-in and the ALTCHA challenge: 30 a minute per address. Syrian mobile carriers put many
# customers behind one address, so this stays well above one person's use.
limit_req_zone $binary_remote_addr zone=vdsignin:10m rate=30r/m;
# Deposit creation and receipt uploads (S03, ADR 0008): 10 a minute per address, under the API's
# per-customer counters in PostgreSQL.
limit_req_zone $binary_remote_addr zone=vddeposit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vdupload:10m rate=10r/m;
# Purchases (S08 rule O1): POST only (an empty key is not counted), 6 a minute per address with a
# burst, under the API's counters (10 per 10 minutes per customer, 30 per address).
map $request_method $vd_purchase_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $vd_purchase_key zone=vdpurchase:10m rate=6r/m;
# Code reveals (S08 rule C2): 30 a minute per address, under the API's 30 per 10 minutes per
# customer.
limit_req_zone $binary_remote_addr zone=vdreveal:10m rate=30r/m;
# Player checks (S09 rule PV4): POST only, 30 a minute per address with a burst, under the API's
# counters (10 an hour and 30 a day per customer, 30 an hour per address, supplier calls only).
limit_req_zone $vd_purchase_key zone=vdplayercheck:10m rate=30r/m;
# Support tickets and messages (S12 TK7, TK11): POST only, 10 a minute per address with a burst,
# under the API's 20 messages an hour per customer; reading tickets is not counted.
limit_req_zone $vd_purchase_key zone=vdticket:10m rate=10r/m;
# Supplier webhooks (S08 rule F4): 120 a minute per address, as the API.
limit_req_zone $binary_remote_addr zone=vdwebhook:10m rate=120r/m;
# Gift and receipt links (S10 rule SH5): the pages /g/ and /r/ and the API's /api/shares/ (their
# data and images), 60 a minute per address, as the API's own limit.
limit_req_zone $binary_remote_addr zone=vdshare:10m rate=60r/m;
# Receipt verification (S21 VF2, VF3): the page /v/ and the API's /api/verify/, 60 a minute per
# address, as the API's own limit, against guessing verification codes.
limit_req_zone $binary_remote_addr zone=vdverify:10m rate=60r/m;
# Direct buy links (S22 DL2): the page /q/ and the API's /api/q/, 60 a minute per address, as the
# API's own limit, against inflating the open counts.
limit_req_zone $binary_remote_addr zone=vdquick:10m rate=60r/m;
# The public whole-catalog reads (audit A03-4): 120 a minute per address, well above a carrier
# address full of customers opening the search (one read per 30 s each), far under what keeps the
# database busy.
limit_req_zone $binary_remote_addr zone=vdcatalog:10m rate=120r/m;
# Hashed static files (the panel's /assets/, the store's /_next/static/), read from disk: the
# server-wide `general` zone (20 a second, burst 50) is too tight for the panel's first load,
# which preloads more than 100 chunks at once over HTTP/2; its rejections fed the server's
# nginx-limit-req jail and banned the owner's address (2026-10-12). A zone of their own keeps a
# ceiling on scrapers without counting a normal page load.
limit_req_zone $binary_remote_addr zone=vdstatic:10m rate=100r/s;
# The live streams (S05 NT6, S11 LR4; audit A07-32): an open stream is one request for up to an
# hour, and HTTP/2 counts every request against `limit_conn`, so behind a carrier address the
# customers' open tabs would take the `perip` slots every other request shares. The streams count
# in a zone of their own instead; the API keeps each customer to 3.
limit_conn_zone $binary_remote_addr zone=vdstream:10m;
