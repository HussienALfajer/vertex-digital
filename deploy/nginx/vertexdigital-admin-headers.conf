# Response headers of digital-admin.vertexmedia.pro, installed as
# /etc/nginx/snippets/vertexdigital-admin-headers.conf. Included in the server block and again in
# every location that sets its own add_header (SERVER.md rule 12).
include snippets/security-headers.conf;
include snippets/vertexdigital-admin-csp.conf;
# The admin panel stays out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
