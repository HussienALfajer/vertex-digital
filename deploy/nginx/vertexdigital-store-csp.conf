# Content Security Policy of digital.vertexmedia.pro, installed as
# /etc/nginx/snippets/vertexdigital-store-csp.conf (ADR 0015). Next.js streams the page data in inline
# scripts that change with every render, and nonces would make every page dynamic (no cache), so
# inline scripts are allowed; everything else is same-origin only. Inline style attributes are
# allowed because Base UI positions popups with them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
