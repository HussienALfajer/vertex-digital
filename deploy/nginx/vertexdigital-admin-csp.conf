# Content Security Policy of digital-admin.vertexmedia.pro, installed as
# /etc/nginx/snippets/vertexdigital-admin-csp.conf. The only inline script is the theme bootstrap
# in apps/admin/index.html; its hash is checked against that file by apps/admin/src/csp.test.ts.
# Inline style attributes are allowed because Base UI positions popups with them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-5FK6VARAd7zJ8Covef82kwWVdhBUB8ymATC5sSPCYUc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
