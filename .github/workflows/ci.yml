name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (the tag in the comment); Dependabot
# proposes updates (.github/dependabot.yml). Jobs and steps arrive with their first subject: E2E
# with the front ends.
jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The superuser only creates the app role and databases (scripts/setup-local-db.mjs); the tests
    # run as the app role, which is not a superuser, as locally and in production: a superuser
    # would bypass the ledger privileges under test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: .env, app role, dev and test databases
        run: node scripts/setup-local-db.mjs
        env:
          PGPASSWORD: postgres
      - name: No known high-severity advisory in production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      - name: OpenAPI document matches the API
        run: |
          pnpm --filter @vertex-digital/api openapi:export
          git diff --exit-code -- apps/api/openapi.json
      # The built apps against the dev database, as PM2 runs them: the API answers its health
      # check, and the worker (app role, ADR 0014) registers its heartbeat schedule in pg-boss.
      - name: The built API and worker start
        run: |
          pnpm db:migrate
          DATABASE_URL="$(grep '^DATABASE_URL=' .env | cut -d= -f2-)"
          node apps/api/dist/main.js > api.log 2>&1 &
          api_pid=$!
          node apps/worker/dist/main.js > worker.log 2>&1 &
          worker_pid=$!
          healthy=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then healthy=yes; break; fi
            sleep 1
          done
          scheduled=""
          for _ in $(seq 1 30); do
            if [ "$(psql "$DATABASE_URL" -tAc "select count(*) from pgboss.schedule where name = 'system.heartbeat'")" = "1" ]; then
              scheduled=yes; break
            fi
            sleep 1
          done
          kill "$api_pid" "$worker_pid" || true
          if [ -z "$healthy" ] || [ -z "$scheduled" ]; then
            echo "health: ${healthy:-no}, heartbeat scheduled: ${scheduled:-no}"
            cat api.log worker.log
            exit 1
          fi

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
